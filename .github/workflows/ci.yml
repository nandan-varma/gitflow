name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      # --prod scopes this to shipped dependencies — the vite/esbuild/babel
      # dev toolchain has its own advisory noise that doesn't reach the
      # built app, and would make this step flaky for no security benefit.
      - run: pnpm audit --prod
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # saving from PR refs would create per-branch duplicates
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
          version: 1
      - run: cargo clippy -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri
      - uses: taiki-e/install-action@cargo-audit
      - name: cargo audit
        working-directory: src-tauri
        run: |
          # RUSTSEC-2026-0194/0195 (quick-xml DoS) come in transitively via
          # tauri -> plist, with no direct dependency of ours to bump; this
          # app also has no code path that parses untrusted XML/plist data.
          # Re-check on every Tauri version bump and drop the ignores once
          # upstream updates plist's quick-xml pin.
          cargo audit --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195
